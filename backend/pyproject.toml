[project]
name = "rendimientos-marginales-backend"
version = "0.1.0"
description = "Motor de análisis de producción, productividad y rendimientos marginales en facturación en salud"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "openpyxl>=3.1.2",
    "sqlalchemy>=2.0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
